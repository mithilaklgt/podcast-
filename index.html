<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PODCAST SUMMARY LIGHTS — International Podcast Festival & Business Expo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0a0b0f;
      --bg-elevated: #12141c;
      --bg-card: #161922;
      --border: rgba(255,255,255,0.08);
      --text: #f4f4f5;
      --text-muted: #a1a1aa;
      --accent: #d4a017;          /* refined gold */
      --accent-soft: rgba(212,160,23,0.15);
      --teal: #0d9488;
      --teal-soft: rgba(13,148,136,0.12);
      --radius: 12px;
      --font-sans: 'Inter', system-ui, sans-serif;
      --font-display: 'Playfair Display', Georgia, serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: var(--font-sans);
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    /* ========== NAV ========== */
    .nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      background: rgba(10,11,15,0.85);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
    }
    .nav-inner {
      max-width: 1280px; margin: 0 auto;
      padding: 0 24px; height: 72px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .logo {
      font-family: var(--font-display);
      font-weight: 600; font-size: 1.25rem;
      letter-spacing: -0.02em;
      color: var(--text);
    }
    .logo span { color: var(--accent); }
    .nav-links {
      display: flex; gap: 32px; list-style: none;
    }
    .nav-links a {
      color: var(--text-muted); text-decoration: none;
      font-size: 0.875rem; font-weight: 500;
      transition: color 0.2s;
    }
    .nav-links a:hover { color: var(--text); }
    .nav-cta {
      background: var(--accent); color: #0a0b0f;
      padding: 10px 20px; border-radius: 999px;
      font-size: 0.875rem; font-weight: 600;
      text-decoration: none;
      transition: transform 0.15s, background 0.15s;
    }
    .nav-cta:hover { background: #e6b422; transform: translateY(-1px); }

    /* ========== HERO ========== */
    .hero {
      min-height: 100vh;
      display: flex; flex-direction: column; justify-content: center;
      padding: 120px 24px 80px;
      position: relative; overflow: hidden;
    }
    .hero::before {
      content: '';
      position: absolute; inset: 0;
      background:
        radial-gradient(ellipse 80% 50% at 50% -20%, rgba(212,160,23,0.12), transparent),
        radial-gradient(ellipse 60% 40% at 80% 60%, rgba(13,148,136,0.08), transparent);
      pointer-events: none;
    }
    .hero-content {
      max-width: 1100px; margin: 0 auto; width: 100%;
      position: relative; z-index: 1;
    }
    .hero-badge {
      display: inline-flex; align-items: center; gap: 8px;
      background: var(--accent-soft);
      color: var(--accent);
      font-size: 0.75rem; font-weight: 600;
      letter-spacing: 0.08em; text-transform: uppercase;
      padding: 8px 16px; border-radius: 999px;
      margin-bottom: 28px;
      border: 1px solid rgba(212,160,23,0.25);
    }
    .hero h1 {
      font-family: var(--font-display);
      font-size: clamp(2.8rem, 7vw, 5.2rem);
      font-weight: 700; line-height: 1.05;
      letter-spacing: -0.03em;
      margin-bottom: 12px;
    }
    .hero-descriptor {
      font-size: clamp(1.1rem, 2.5vw, 1.5rem);
      color: var(--text-muted);
      font-weight: 400;
      margin-bottom: 20px;
    }
    .hero-tagline {
      font-size: 1.25rem;
      color: var(--accent);
      font-weight: 500;
      letter-spacing: 0.04em;
      margin-bottom: 32px;
    }
    .hero-supporting {
      max-width: 640px;
      font-size: 1.05rem;
      color: var(--text-muted);
      margin-bottom: 48px;
      line-height: 1.7;
    }
    .hero-actions {
      display: flex; flex-wrap: wrap; gap: 16px;
      margin-bottom: 56px;
    }
    .btn-primary {
      background: var(--accent); color: #0a0b0f;
      padding: 16px 32px; border-radius: 999px;
      font-weight: 600; font-size: 1rem;
      text-decoration: none;
      display: inline-flex; align-items: center; gap: 8px;
      transition: all 0.2s;
    }
    .btn-primary:hover { background: #e6b422; transform: translateY(-2px); }
    .btn-secondary {
      background: transparent; color: var(--text);
      padding: 16px 32px; border-radius: 999px;
      font-weight: 500; font-size: 1rem;
      text-decoration: none;
      border: 1px solid var(--border);
      transition: all 0.2s;
    }
